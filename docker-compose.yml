services:
  goread:
    image: ghcr.io/jdbnet/goread:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      LIBRARY_PATH: /library
      DATA_DIR: /data
      TZ: ${TZ:-UTC}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-5m}
    volumes:
      # Existing EPUB library. Read-only: the app never rewrites books.
      - ${LIBRARY_HOST_PATH:-./library}:/library:ro
      # SQLite database and extracted/matched covers.
      - goread-data:/data
    restart: unless-stopped

volumes:
  goread-data:
